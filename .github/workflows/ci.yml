name: SmartDrive CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Verify server starts cleanly
        run: |
          npm start &
          SERVER_PID=$!
          echo "Waiting 5 seconds for server to initialize..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "Server responded with HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Error: Expected HTTP 200 but received $STATUS"
            kill $SERVER_PID
            exit 1
          fi
          echo "✅ Server verified and running successfully on port 3000!"
          kill $SERVER_PID
